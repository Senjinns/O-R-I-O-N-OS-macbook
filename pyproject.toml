[project]
name = "orion-os-macbook"
version = "1.0.0"
description = "Assistant vocal agentique pour macOS (Apple Silicon M2) avec Claude & Whisper"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ORION Team" }
]
dependencies = [
    "anthropic>=0.40.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
    "openwakeword>=0.6.0",
    "edge-tts>=6.1.19",
    "elevenlabs>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0.2",
    "psutil>=6.1.0",
    "pillow>=11.0.0",
    "playwright>=1.49.0",
    "twilio>=9.4.0",
    "spotipy>=2.25.0",
    "shazamio>=0.8.0",
    "obs-websocket-py>=1.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "aiohttp>=3.11.0",
    "mcp>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
